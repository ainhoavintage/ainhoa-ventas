<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ainhoa · Devoluciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF7F1; --ink:#111111; --caramelo:#B87F45;
    --green:#4C7A5E; --tan:#A68A64; --gray:#8A8A8A; --borde:#EAE3D5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:Georgia,serif; background:var(--cream); color:var(--ink)}
  button,input{font-family:Georgia,serif}
  .display{font-family:'Cormorant Garamond',Georgia,serif}

  header{background:var(--ink); padding:34px 20px 26px; text-align:center}
  header .marca{color:#fff; font-size:34px; letter-spacing:6px; font-weight:500}
  header .sub{color:#ffffffb0; font-size:11px; letter-spacing:3px; margin-top:6px; text-transform:uppercase}

  .wrap{max-width:440px; margin:0 auto; padding:22px 18px 60px}

  .card{width:100%; text-align:left; padding:18px; border-radius:16px; border:1px solid var(--borde);
        background:#fff; cursor:pointer; margin-bottom:10px; display:block}
  .card:active{background:#F5F0E6}
  .landing{display:flex; align-items:center; gap:16px}
  .landing .ic{width:26px; height:26px; display:flex; align-items:center; justify-content:center; flex:0 0 26px}
  .landing .tx{flex:1}
  .landing .t{font-size:17px}
  .landing .s{font-size:11.5px; color:var(--tan); margin-top:2px}

  .tag{display:inline-block; padding:4px 12px; border-radius:999px; font-size:10.5px;
       letter-spacing:1px; text-transform:uppercase; white-space:nowrap}

  .buscador{width:100%; padding:16px; font-size:17px; border:1px solid #ddd6c8;
            border-radius:14px; margin-bottom:12px; background:#fff}
  .buscador:focus{outline:none; border-color:var(--tan)}

  .orden{position:relative; margin-bottom:16px}
  .orden .btn{width:100%; display:flex; align-items:center; justify-content:space-between;
              padding:12px 16px; border-radius:14px; border:1px solid var(--borde);
              background:#fff; color:var(--ink); font-size:13.5px; text-align:left}
  .orden .btn .et{color:var(--tan)}
  .orden .menu{position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20; background:#fff;
               border:1px solid var(--borde); border-radius:14px; overflow:hidden;
               box-shadow:0 8px 24px rgba(17,17,17,.10)}
  .orden .menu button{width:100%; text-align:left; padding:13px 16px; font-size:13.5px;
                      border:none; border-top:1px solid #F2ECE0; background:#fff; color:var(--ink)}
  .orden .menu button:first-child{border-top:none}
  .orden .menu button.on{background:#F5F0E6; color:var(--caramelo)}

  .prenda{background:#fff; border:1px solid var(--borde); border-radius:16px; padding:16px; margin-bottom:10px}
  .prenda.busy{opacity:.55; pointer-events:none}
  .fila{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .cod{color:var(--caramelo); font-weight:600}
  .prod{font-size:14.5px; margin:6px 0 2px; line-height:1.35}
  .prov{font-size:12px; color:var(--tan)}
  .fecha{font-size:11px; color:#bbb; margin-top:2px; margin-bottom:12px}
  .nota{background:#8A8A8A18; border-radius:10px; padding:8px 10px; font-size:12.5px; color:#555; margin-bottom:10px}

  .estados{display:flex; gap:6px}
  .eb{flex:1; padding:11px 3px; border-radius:10px; font-size:11.5px; line-height:1.2; background:#fff}
  .stock-btn{width:100%; margin-top:6px; padding:8px; border-radius:10px; border:1px solid var(--borde);
             background:transparent; color:#999; font-size:11px}

  .campo{margin-top:10px}
  .campo .titulo{font-size:12.5px; color:#666; margin-bottom:6px}
  .campo input{width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; font-size:13px; margin-bottom:6px}
  .campo .acciones{display:flex; gap:6px}
  .campo .guardar{flex:2; padding:9px; border-radius:10px; border:none; background:var(--gray); color:#fff; font-size:12.5px}
  .campo .cancelar{flex:1; padding:9px; border-radius:10px; border:1px solid #ddd; background:#fff; color:#666; font-size:12.5px}

  .acc{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .acc button{flex:1; padding:10px; border-radius:10px; font-size:13px; border:1px solid #ddd; background:#fff; color:var(--ink)}
  .acc button.wa{flex:1 1 100%; border:none; background:var(--green); color:#fff}
  .acc button.borrar{flex:1 1 100%; border-color:#E4C9C9; color:#A76A6A}
  .acc button.prim{border:none; background:var(--green); color:#fff}

  .sel{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid #F2ECE0; font-size:13px}
  .sel .mk{width:20px; height:20px; border-radius:6px; border:1px solid #ddd6c8; flex:0 0 20px;
           display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff}
  .sel.on .mk{background:var(--caramelo); border-color:var(--caramelo)}
  .mapa-mueble{margin-bottom:18px}
  .mapa-mueble h3{font-size:12.5px; letter-spacing:1.5px; color:var(--tan);
                  text-transform:uppercase; margin:0 0 8px; font-weight:normal}
  .lugares{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .lugar{cursor:pointer; border:1px solid var(--borde); border-radius:14px; padding:12px; background:#fff; min-height:74px}
  .lugar.libre{background:transparent; border-style:dashed}
  .lugar .n{font-size:13px; margin-bottom:4px}
  .lugar .c{font-size:11px; color:var(--tan)}
  .lugar .p{font-size:11.5px; color:var(--caramelo); margin-top:4px; line-height:1.35}
  .etiqueta{background:#fff; border:1px dashed var(--caramelo); border-radius:16px; padding:18px; text-align:center; margin-bottom:10px}
  .etiqueta .l1{font-size:12px; letter-spacing:2px; color:var(--tan); text-transform:uppercase}
  .etiqueta .l2{font-size:20px; margin:6px 0}
  .etiqueta .l3{font-size:15px; color:var(--caramelo)}
  .vacio{color:#999; text-align:center; padding:24px 0}
  .cargando{text-align:center; color:var(--tan); padding:30px 0}
  .errorbox{background:#fff; border:1px solid var(--borde); border-radius:16px; padding:18px; text-align:center}
  .errorbox button{margin-top:12px; padding:10px 20px; border-radius:10px; border:none; background:var(--ink); color:#fff; font-size:13px}
  .titulo-prov{font-size:16px; font-weight:600; margin-bottom:12px}
  .conteo{font-size:12.5px; color:var(--tan); margin:0 0 12px; letter-spacing:1px}
  .volver{margin-top:8px; background:none; border:none; color:#999; font-size:13px; padding:6px 0}
  .aviso{position:sticky; top:0; z-index:30; color:#fff; text-align:center; padding:10px 16px; font-size:13px}
  .nav{position:sticky; top:0; z-index:25; background:var(--cream); border-bottom:1px solid var(--borde);
       display:flex; justify-content:space-between; align-items:center; padding:10px 18px}
  .nav button{background:none; border:none; color:#777; font-size:14px; padding:6px 2px}
  .nav .inicio{color:var(--caramelo)}

/* Respuesta al toque: se hunde y se aclara apenas la apretás,
   sin esperar al servidor. */
.card, button { -webkit-tap-highlight-color: transparent; transition: transform .06s, opacity .12s; }
.card:active, button:active { transform: scale(.97); opacity:.55; }
.card.apretado, button.apretado { opacity:.4; transform: scale(.97); pointer-events:none; }
button[disabled]{ opacity:.4; pointer-events:none; }

/* Botón grande de escanear */
.escan {
  width:100%; border:none; border-radius:18px; cursor:pointer;
  background:#2B2622; color:#F7F2EA;
  padding:30px 18px 26px 18px; margin-bottom:20px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
}
.escan .et {
  font-size:22px; font-weight:600; letter-spacing:.14em;
  margin-top:12px;
}
.escan .es { font-size:12.5px; opacity:.6; margin-top:5px; letter-spacing:.02em; }

/* Cámara a pantalla completa */
#camWrap {
  position:fixed; inset:0; background:#000; z-index:9999;
  display:none; flex-direction:column; align-items:center; justify-content:center;
}
#camWrap video { width:100%; max-width:520px; }
#camWrap .marco {
  position:absolute; width:62vw; height:62vw; max-width:290px; max-height:290px;
  border:3px solid rgba(255,255,255,.85); border-radius:20px;
}
#camWrap .txt {
  position:absolute; bottom:96px; color:#fff; font-size:15px;
  text-align:center; padding:0 24px; text-shadow:0 1px 4px rgba(0,0,0,.6);
}
#camWrap .cerrar {
  position:absolute; bottom:28px; background:#fff; color:#2B2622;
  border:none; border-radius:12px; padding:14px 32px; font-size:16px;
}

/* Mapa del depósito */
.amb { margin-bottom:26px; }
.amb > h3 { font-size:12px; letter-spacing:.22em; text-transform:uppercase;
            color:#A68A64; font-weight:600; margin:0 0 10px 0; }
.mu { background:#fff; border:1px solid #E7DED2; border-radius:12px;
      padding:11px 12px; margin-bottom:10px; }
.mu .nom { font-size:12.5px; color:#8A8A8A; margin-bottom:8px; }
.est { border-radius:6px; padding:8px 11px; margin-bottom:4px; cursor:pointer;
       display:flex; justify-content:space-between; align-items:center; gap:8px; }
.est .u { font-size:13.5px; }
.est .d { font-size:11.5px; opacity:.8; white-space:nowrap; }
.est.marcado { outline:2.5px solid #B87F45; outline-offset:1px; }
.filtro { display:flex; gap:8px; margin-bottom:14px; }
.filtro button { flex:1; font-size:13px; padding:9px 6px; }
.filtro button.on { background:#2B2622; color:#F7F2EA; border-color:#2B2622; }
.leyenda { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:#8A8A8A; margin-bottom:16px; }
.leyenda i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; font-style:normal; }

.listaMu { margin:4px 0 12px 0; }
.grupoMu { margin-bottom:10px; }
.grupoMu .gt { font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:#A68A64; margin-bottom:5px; }
.itemMu { display:flex; align-items:center; gap:8px; padding:7px 9px; border:1px solid #EDE5DA;
          border-radius:7px; margin-bottom:4px; cursor:pointer; }
.itemMu.marcado { border-color:#B87F45; border-width:2px; }
.itemMu .mn { flex:1; font-size:13px; }
.itemMu .mc { font-size:12px; color:#8A8A8A; }

/* ---- Rediseño depósito ---- */
.plano { width:100%; height:auto; display:block; }
.plano text { text-anchor:middle; }
.pl-amb { font-family:'Cormorant Garamond',Georgia,serif; fill:#81796F; }
.pl-let { font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; fill:#292622; }
.pl-mu  { font-family:'Montserrat',sans-serif; fill:#6F6962; }
.pl-badge { font-family:'Montserrat',sans-serif; fill:#FFF; font-weight:600; }

.card-ai { background:#FFF; border:1px solid #E6DED3; border-radius:18px;
           padding:16px; margin-bottom:16px; box-sizing:border-box; }
.plano-box { background:#FAF8F4; border-radius:12px; padding:10px; margin-top:16px; }

.eyebrow { font-family:'Montserrat',sans-serif; font-size:10px; font-weight:600;
           letter-spacing:1.8px; text-transform:uppercase; color:#A77945; }
.tit-ed  { font-family:'Cormorant Garamond',Georgia,serif; font-size:23px; font-weight:500;
           color:#292622; margin-top:4px; line-height:1.15; }
.sub-op  { font-family:'Montserrat',sans-serif; font-size:11px; color:#8B8781; margin-top:6px; }

.filas { margin-top:12px; }
.fila-sec { display:flex; align-items:center; gap:12px; height:54px;
            border-bottom:1px solid #ECE6DE; cursor:pointer; }
.fila-sec.marcado .fn { color:#A77945; }
.fila-sec .fl { font-family:'Cormorant Garamond',Georgia,serif; font-size:16px; font-weight:600;
                color:#292622; min-width:24px; }
.fila-sec .fn { flex:1; font-family:'Montserrat',sans-serif; font-size:14px;
                font-weight:500; color:#292622; }
.fila-sec .fc { font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600; color:#817B73; }
.fila-sec .fch { color:#B4ADA3; font-size:15px; }
.link-atras { background:none; border:none; padding:0 0 14px 0; color:#817B73;
              font-family:'Montserrat',sans-serif; font-size:12px; cursor:pointer; }

#qMapa { font-family:'Montserrat',sans-serif; font-size:14px; }

@media (min-width:768px){
  .card-ai { padding:24px; }
  .tit-ed { font-size:26px; }
  .plano-box { padding:16px; }
  .plano { max-width:640px; margin:0 auto; }
}

@media (min-width:1100px){
  .wrap { max-width:1100px; margin:0 auto; padding-left:32px; padding-right:32px; }
  .card-ai { padding:28px; }
  .tit-ed { font-size:27px; }
  .plano { max-width:760px; margin:0 auto; }
  .filas { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
           column-gap:40px; }
  #qMapa { max-width:620px; }
}
</style>
</head>
<body>

<header>
  <div class="display marca">AINHOA</div>
  <div class="sub">Depósito · Devoluciones</div>
</header>
<div id="aviso"></div>
<div id="nav"></div>
<div class="wrap" id="app"></div>

<div id="camWrap">
  <video id="cam" playsinline muted></video>
  <div class="marco"></div>
  <div class="txt">Apuntá al código del estante</div>
  <button class="cerrar" id="camCerrar">Cancelar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbyZbEeODB-LF71H32WLSJafEKpl4sQNzMEiNQ2nvxK6LjNc1pmX0NMEbKSi5s7EXk9d/exec";

var CARAMELO = "#B87F45", TAN = "#A68A64", GRAY = "#8A8A8A", GREEN = "#4C7A5E";
var STOCK = "En stock";
var ESTADOS = {
  "Devuelta":            { label: "Devuelta",           color: CARAMELO },
  "Última Oportunidad":  { label: "Última oportunidad", color: TAN },
  "Revisar":             { label: "Revisar",            color: GRAY }
};
var TIPOS = [
  {id:"Devolución preselección",     label:"Devolución preselección",     ayuda:"Lo que no quedó seleccionado al hacer stock"},
  {id:"Devolución fin de temporada", label:"Devolución fin de temporada", ayuda:"Prendas que estuvieron a la venta y se devuelven"},
  {id:"Para hacer stock",            label:"Para hacer stock",            ayuda:"Trajo la bolsa y todavía hay que ingresarla"}
];
function etiquetaTipo(t){
  if(t === "Devolución preselección") return "Preselección";
  if(t === "Devolución fin de temporada") return "Fin de temporada";
  if(t === "Para hacer stock") return "Stock";
  return t || "";
}
function colorTipo(t){
  if(t === "Para hacer stock") return TAN;
  if(t === "Devolución preselección") return GRAY;
  return CARAMELO;
}

function colorEstado(e){
  if(e==="Devuelta") return CARAMELO;
  if(e==="Última Oportunidad") return TAN;
  if(e==="Revisar") return GRAY;
  if(e==="Vendida") return GREEN;
  if(e==="Reservada") return "#9A7040";
  return TAN;
}

var ORDEN_PROV = [
  {id:"nombre-az",     label:"Nombre A – Z"},
  {id:"nombre-za",     label:"Nombre Z – A"},
  {id:"mas-prendas",   label:"Más prendas primero"},
  {id:"menos-prendas", label:"Menos prendas primero"},
  {id:"ingreso-viejo", label:"Ingreso más antiguo primero"},
  {id:"ingreso-nuevo", label:"Ingreso más reciente primero"}
];
var ORDEN_ITEMS = [
  {id:"original",      label:"Orden original"},
  {id:"ingreso-viejo", label:"Ingreso más antiguo primero"},
  {id:"ingreso-nuevo", label:"Ingreso más reciente primero"}
];

var S = {
  screen:"home",
  resumen:{pendientesAviso:0, pendientesRevision:0},
  provs:[], provQuery:"", ordenProv:"nombre-az", ordenAbierto:false,
  prov:null, items:[], ordenItems:"original",
  codQuery:"", resultados:[], buscando:false,
  grupos:[], revisiones:[],
  depQuery:"", depResultados:[], depBuscando:false, depTotal:0,
  ubicaciones:[], mapa:null, moverBolsa:null, origenCarga:"lugar",
  lugarSel:null, nueva:null, provBusq:"", provLista:[], provBuscando:false,
  provTodas:null, provCargandoTodas:false, guardandoTexto:"",
  vencidas:[], vencMeses:3,
  mapaProv:"", ambSel:null, muebleSel:null, secSel:null, ambDetalle:null,
  bolsaFecha:"", viejasDias:0, editBolsa:null, guardandoBolsa:false,
  bolsaCantidad:"",
  guardando:{}, guardandoTodas:false, porGuardar:{}, notaAbierta:null, notaTexto:"",
  devs:[], devQuery:"", devProv:null
};

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fechaCorta(iso){
  if(!iso || iso.length < 10) return iso || "";
  var p = iso.split("-");
  return p[2] + "/" + p[1] + "/" + p[0].slice(2);
}

function api(action, params){
  params = params || {};
  var qs = "action=" + encodeURIComponent(action);
  for(var k in params){
    if(params[k] === undefined || params[k] === null) continue;
    qs += "&" + k + "=" + encodeURIComponent(params[k]);
  }
  // Si la señal se corta, se reintenta solo un par de veces antes de
  // avisar. Antes, un corte de un segundo dejaba la prenda sin guardar.
  // ARREGLADO 08/10/2026: el "_" con la hora hace que cada pedido sea una
  // dirección distinta. Si no, el navegador guarda la respuesta y te
  // muestra datos viejos sin avisar.
  function intento(quedan){
    var unico = "&_=" + Date.now() + Math.floor(Math.random() * 1000);
    return fetch(API + "?" + qs + unico, { cache: "no-store" })
      .then(function(r){
        if(!r.ok) throw new Error("No se pudo conectar con el Sheet");
        return r.json();
      })
      .then(function(d){
        if(d.ok === false) throw new Error(d.error || "Error del servidor");
        return d;
      })
      .catch(function(e){
        var deRed = String(e.message || "").indexOf("conectar") > -1 ||
                    String(e.name || "") === "TypeError";
        if(quedan > 0 && deRed){
          return new Promise(function(res){ setTimeout(res, 1200); }).then(function(){ return intento(quedan - 1); });
        }
        throw e;
      });
  }
  return intento(2);
}

var avisoTimer = null;
function aviso(texto, tono){
  var el = document.getElementById("aviso");
  el.innerHTML = '<div class="aviso" style="background:' + (tono||GREEN) + '">' + esc(texto) + '</div>';
  if(avisoTimer) clearTimeout(avisoTimer);
  avisoTimer = setTimeout(function(){ el.innerHTML = ""; }, 2800);
}

/* ---------------- iconos ---------------- */
function icono(n){
  var a = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="' + TAN +
          '" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">';
  if(n==="buscar")  return a + '<circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.4" y1="15.4" x2="21" y2="21"/></svg>';
  if(n==="codigo")  return a + '<path d="M12.6 2.8H21v8.4L11.2 21 3 12.8z"/><circle cx="17.1" cy="6.9" r="1.2"/></svg>';
  if(n==="deposito") return a + '<path d="M3 8.5 12 4l9 4.5v7L12 20l-9-4.5z"/><path d="M3 8.5 12 13l9-4.5"/><path d="M12 13v7"/></svg>';
  if(n==="aviso")   return a + '<rect x="4.5" y="3" width="15" height="18" rx="2.2"/><line x1="8.5" y1="8.5" x2="15.5" y2="8.5"/><line x1="8.5" y1="12.3" x2="15.5" y2="12.3"/><line x1="8.5" y1="16.1" x2="12.5" y2="16.1"/></svg>';
  return a + '<path d="M12 3.2 21 20.4H3z"/><line x1="12" y1="10" x2="12" y2="14.4"/><line x1="12" y1="17.2" x2="12" y2="17.3"/></svg>';
}

/* ---------------- carga de datos ---------------- */
function cargarResumen(){
  api("devolResumen").then(function(r){
    S.resumen = {pendientesAviso:r.pendientesAviso, pendientesRevision:r.pendientesRevision};
    if(S.screen === "home") render();
  }).catch(function(){});
}

function cargar(nombre){
  S.cargando = true; S.error = null; render();
  var p;
  if(nombre === "provs")      p = api("devolProveedoras").then(function(r){ S.provs = r.proveedoras; });
  else if(nombre === "items") p = api("devolPrendas", {prov:S.prov.num}).then(function(r){ S.items = r.prendas; });
  else if(nombre === "grupos")p = api("devolPendientes").then(function(r){ S.grupos = r.grupos; });
  else if(nombre === "devs")  p = api("devolDevueltas").then(function(r){ S.devs = r.prendas || []; });

/* Los QR impresos tienen el nombre del mueble como estaba cuando se
   imprimieron. Si después se renombró el mueble en la hoja Ubicaciones,
   el nombre del QR ya no coincide y el lugar aparecía vacío, además de
   guardar las bolsas en un mueble que no existe.

   Como los QR están pegados en los estantes y no se pueden cambiar, es
   la app la que se adapta: busca el lugar real por la ubicación y
   corrige el nombre del mueble con el que figura en la hoja. */
function normalizarLugarSel(){
  if(!S.mapa || !S.lugarSel || !S.lugarSel.ubicacion) return;

  var qU = normTxt(S.lugarSel.ubicacion);
  var qM = normTxt(S.lugarSel.mueble || "");
  // El QR y la hoja pueden partir el nombre en distinto lugar:
  //   QR   -> mueble "Placard pasillo"        · lugar "baulera 1"
  //   hoja -> mueble "Placard pasillo baulera" · lugar "1"
  // Pegados dan lo mismo, así que comparamos el nombre completo.
  var qEntero = (qM + " " + qU).replace(/\s+/g, " ").trim();

  var exacto = null, porEntero = null, porUbicacion = [];

  S.mapa.muebles.forEach(function(m){
    m.lugares.forEach(function(l){
      var lU = normTxt(l.ubicacion), lM = normTxt(l.mueble || "");
      var lEntero = (lM + " " + lU).replace(/\s+/g, " ").trim();

      if(lM === qM && lU === qU) exacto = l;
      if(!porEntero && lEntero === qEntero) porEntero = l;
      if(lU === qU) porUbicacion.push(l);
    });
  });

  var elegido = exacto || porEntero;

  if(!elegido && porUbicacion.length){
    elegido = porUbicacion[0];
    if(porUbicacion.length > 1 && qM){
      for(var i = 0; i < porUbicacion.length; i++){
        var nm = normTxt(porUbicacion[i].mueble);
        if(nm.indexOf(qM) === 0 || qM.indexOf(nm) === 0){ elegido = porUbicacion[i]; break; }
      }
    }
  }

  if(elegido) S.lugarSel = {mueble:elegido.mueble, ubicacion:elegido.ubicacion};
}

// Qué bolsas hay hoy en el lugar que estoy mirando.
function bolsasDelLugar(){
  if(!S.mapa || !S.lugarSel) return [];
  var out = [];
  S.mapa.muebles.forEach(function(m){
    m.lugares.forEach(function(l){
      if(l.mueble === S.lugarSel.mueble && l.ubicacion === S.lugarSel.ubicacion) out = l.bolsas;
    });
  });
  return out;
}

/* Guarda N bolsas iguales (misma proveedora, mismo tipo, mismo
   lugar) de una sola vez. Las manda una atrás de otra para que el
   Sheet les de numeros distintos sin pisarse. */
function crearVariasBolsas(cuantas){
  var n = S.nueva;
  if(!n || !n.prov || !n.tipo || !n.ubicacion){ aviso("Faltan datos de la bolsa", GRAY); return; }
  cuantas = parseInt(cuantas, 10) || 1;

  // Candado propio del guardado. Antes dependía de "cargando" y del
  // candado general, que otras cargas (el mapa, las ubicaciones) podían
  // soltar a mitad de camino: los botones volvían a aparecer mientras
  // se guardaba y un segundo toque creaba bolsas de más.
  if(S.guardandoBolsa) return;
  S.guardandoBolsa = true;

  S.cargando = true; S.guardandoTexto = cuantas > 1 ? "Guardando 1 de " + cuantas + "…" : "Guardando la bolsa…";
  render();

  // Un código por tanda: si el mismo pedido llega dos veces, el
  // servidor lo reconoce y no crea otra bolsa.
  var token = "T" + Date.now() + Math.floor(Math.random() * 1e6);

  var params = {prov:n.prov.num || "", nombreLibre:(n.prov.num ? "" : n.prov.nombre),
                tipo:n.tipo, ubicacion:n.ubicacion, mueble:n.mueble || "",
                fecha:(S.bolsaFecha || hoyISO()), token:token};
  var nombreProv = n.prov.nombre, lugar = (n.mueble ? n.mueble + " · " : "") + n.ubicacion;
  var hechas = 0;

  function una(){
    params.i = hechas;
    return api("devolBolsaCrear", params).then(function(){
      hechas++;
      if(hechas < cuantas){
        S.guardandoTexto = "Guardando " + (hechas + 1) + " de " + cuantas + "…";
        render();
        return una();
      }
    });
  }

  function terminar(){
    S.guardandoBolsa = false;
    S.nueva = null; S.bolsaCantidad = ""; S.ubicaciones = []; S.guardandoTexto = "";
    if(S.origenCarga === "lugar"){ escribiendo = false; cargarUbicaciones(); cargarMapa("lugar"); }
    else { S.cargando = false; escribiendo = false; if(S.prov){ S.screen = "itemsProv"; cargar("items"); } else ir("deposito"); }
  }

  una().then(function(){
    aviso((cuantas > 1 ? cuantas + " bolsas de " : "Bolsa de ") + nombreProv + " en " + lugar);
    terminar();
  }).catch(function(e){
    // El servidor frenó un duplicado: la bolsa ya estaba guardada.
    if(/ya se guard/i.test(e.message)){
      aviso("Esa bolsa ya estaba guardada. No se cargó de nuevo.");
      terminar();
      return;
    }
    S.guardandoBolsa = false;
    S.cargando = false; S.guardandoTexto = ""; escribiendo = false; render();
    aviso((hechas ? "Se guardaron " + hechas + ". Falló el resto: " : "No se guardó: ") + e.message, GRAY);
  });
}

var timerProvB = null, provBId = 0;
/* La lista de proveedoras se baja UNA sola vez y despues se filtra
   en el celular. Antes cada letra que escribias iba y volvia del
   servidor: por eso tardaba varios segundos. */
/* ============================================================
   ESCANER DE QR
   Abre la camara del celular dentro de la app y lee el codigo
   del estante. Al leerlo entra directo a ese lugar. No hace
   falta instalar nada: es la camara del navegador.
   ============================================================ */
var camStream = null, camRAF = null;

function abrirCamara(){
  if(typeof jsQR !== "function"){
    aviso("No se pudo cargar el lector. Usá la cámara del celular.", GRAY);
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    aviso("Este navegador no permite usar la cámara", GRAY);
    return;
  }

  var wrap = document.getElementById("camWrap");
  var video = document.getElementById("cam");
  wrap.style.display = "flex";

  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}})
    .then(function(st){
      camStream = st;
      video.srcObject = st;
      video.setAttribute("playsinline", true);
      video.play();
      leerFrames(video);
    })
    .catch(function(){
      cerrarCamara();
      aviso("No diste permiso para la cámara", GRAY);
    });
}

function leerFrames(video){
  var lienzo = document.createElement("canvas");
  var ctx = lienzo.getContext("2d", {willReadFrequently:true});

  function tick(){
    if(!camStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      lienzo.width  = video.videoWidth;
      lienzo.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, lienzo.width, lienzo.height);
      var img = ctx.getImageData(0, 0, lienzo.width, lienzo.height);
      var code = jsQR(img.data, img.width, img.height, {inversionAttempts:"dontInvert"});
      if(code && code.data){
        cerrarCamara();
        irAlLugarDeLink(code.data);
        return;
      }
    }
    camRAF = requestAnimationFrame(tick);
  }
  tick();
}

function cerrarCamara(){
  if(camRAF) cancelAnimationFrame(camRAF);
  camRAF = null;
  if(camStream){
    camStream.getTracks().forEach(function(t){ t.stop(); });
    camStream = null;
  }
  var wrap = document.getElementById("camWrap");
  if(wrap) wrap.style.display = "none";
}

// Toma la direccion leida del QR y abre ese estante sin recargar.
function irAlLugarDeLink(texto){
  var u = "", m = "";
  try {
    var qs = texto.indexOf("?") > -1 ? texto.split("?")[1] : texto;
    qs.split("&").forEach(function(par){
      var kv = par.split("=");
      var k = kv[0], v = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
      if(k === "u") u = v;
      if(k === "m") m = v;
    });
  } catch(err){ u = ""; }

  if(!u){ aviso("Ese código no es de un estante de Ainhoa", GRAY); return; }

  S.origenCarga = "lugar";
  S.lugarSel = {mueble:m, ubicacion:u};
  cargarMapa("lugar");
}

/* Parte el nombre en dos lineas cuando no entra en una sola. */
function dosLineas(t, anchoBloque, tam){
  var maxCh = Math.floor((anchoBloque - 8) / (tam * 0.56));
  if(t.length <= maxCh) return [t];
  var p = t.split(" ");
  if(p.length < 2) return [t];
  var mitad = Math.ceil(p.length / 2);
  return [p.slice(0, mitad).join(" "), p.slice(mitad).join(" ")];
}

/* Dibuja un bloque del croquis. f escala los textos para que se lean
   igual en el plano general y en el detalle de una habitacion. */
function bloqueSVG(g, i, f){
  var b = bolsasDeBloque(g);
  var sel = (S.secSel === i);
  var out = '<g data-a="secSel" data-i="' + i + '" style="cursor:pointer">';
  out += '<rect x="' + g.x + '" y="' + g.y + '" width="' + g.w + '" height="' + g.h +
         '" rx="' + (6 * f) + '" fill="' + (sel || b.marcado ? "#D9B16F" : colorMueble(b.n)) + '" stroke="' +
         (sel || b.marcado ? "#9A7040" : bordeMueble(b.n)) +
         '" stroke-width="' + ((sel || b.marcado ? 2.2 : 1) * f) + '"/>';

  var tLet = 13 * f, tNom = 7 * f;
  var lineas = dosLineas(g.t, g.w / f, tNom / f);
  var cx = g.x + g.w/2;
  var altoTexto = tLet + 2*f + lineas.length * (tNom + 1.5*f);
  var y0 = g.y + g.h/2 - altoTexto/2 + tLet * 0.82;

  out += '<text x="' + cx + '" y="' + y0 + '" class="pl-let" font-size="' + tLet + '">' +
         esc(g.L) + '</text>';
  lineas.forEach(function(l, k){
    out += '<text x="' + cx + '" y="' + (y0 + (tLet * 0.28) + (k + 1) * (tNom + 1.5 * f)) +
           '" class="pl-mu" font-size="' + tNom + '">' + esc(l) + '</text>';
  });

  if(b.n){
    var r = 7.5 * f, m = 4 * f;
    out += '<circle cx="' + (g.x + g.w - r - m) + '" cy="' + (g.y + r + m) + '" r="' + r +
           '" fill="#1C1B19"/>' +
           '<text x="' + (g.x + g.w - r - m) + '" y="' + (g.y + r + m + 3.1 * f) +
           '" class="pl-badge" font-size="' + (8.5 * f) + '">' + b.n + '</text>';
  }
  return out + '</g>';
}

// Cuantas bolsas hay en un bloque del croquis.
function bolsasDeBloque(g){
  var n = 0, marcado = false;
  if(!S.mapa) return {n:0, marcado:false};
  S.mapa.muebles.forEach(function(m){
    if((m.mueble || m.nombre) !== g.m) return;
    m.lugares.forEach(function(l){
      if(g.pre){
        var u = normTxt(l.ubicacion);
        var ok = false;
        g.pre.forEach(function(p){ if(u.indexOf(normTxt(p)) > -1) ok = true; });
        if(!ok) return;
      }
      n += l.bolsas.length;
      if(lugarTieneProv(l)) marcado = true;
    });
  });
  return {n:n, marcado:marcado};
}

// Nombre corto del mueble para que entre en el dibujo.
function nombreCorto(n){
  var t = String(n || "").trim();
  var c = t.replace(/placard/ig, "")
           .replace(/dep[oó]sito/ig, "")
           .replace(/escritorio/ig, "")
           .replace(/pasillo/ig, "")
           .replace(/sala fiesta/ig, "")
           .replace(/ba[ñn]o/ig, "")
           .replace(/\s+/g, " ").trim();
  if(!c) c = t;
  if(/^deposito$/i.test(t)) c = "estanterías";
  if(/espejo/i.test(t)) c = "espejo";
  if(/del$/i.test(c)) c = "placard";
  return c.charAt(0).toUpperCase() + c.slice(1);
}

function bolsasDeMueble(m){
  var n = 0, marcado = false;
  m.lugares.forEach(function(l){
    n += l.bolsas.length;
    if(lugarTieneProv(l)) marcado = true;
  });
  return {n:n, marcado:marcado};
}

function colorMueble(n){

function bordeMueble(n){

// Plata con puntos de mil, para que se lea de un vistazo.
function guita(n){
  var x = Math.round(Number(n) || 0);
  return "$" + String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function textoMeses(m){
  if(m >= 99) return "de antes de agosto";
  if(m <= 0)  return "de este mes";
  if(m === 1) return "del mes pasado";
  return "de hace " + m + " meses";
}

function ambienteDe(mueble){
  for(var i = 0; i < AMBIENTES.length; i++){
    if(AMBIENTES[i].test(mueble || "")) return AMBIENTES[i].nombre;
  }
  return "Otros";
}

// De arriba hacia abajo, como se ve el mueble parada enfrente.
function ordenLugar(u){
  var t = String(u || "").toLowerCase();
  if(t.indexOf("rooftop") > -1) return 0;
  var m = t.match(/estante\s*(\d+)/);
  if(m) return 100 - parseInt(m[1], 10);
  if(t.indexOf("mesa") > -1) return 200;
  if(t.indexOf("barral") > -1) return 210;
  if(t.indexOf("piso") > -1) return 220;
  if(t.indexOf("baulera") > -1) return 230;
  if(t.indexOf("adera") > -1) return 240;
  return 250;
}

function diasDesde(f){
  if(!f) return null;
  var d = new Date(String(f).slice(0,10) + "T00:00:00");
  if(isNaN(d)) return null;
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.floor((hoy - d) / 86400000);
}

// Devuelve {fondo, texto, nota} para un lugar segun el filtro elegido.
function colorLugar(l){
  var n = l.bolsas.length;
  if(l.lleno) {
    return {fondo:"#F7C1C1", texto:"#791F1F",
            nota:"LLENO" + (n ? " · " + n : "")};
  }
  if(!n) return {fondo:"#F1EFE8", texto:"#8A8A8A", nota:"vacío"};

  // La antiguedad no pinta el estante, pero se sigue viendo al costado.
  var masVieja = null;
  l.bolsas.forEach(function(b){
    var d = diasDesde(b.fecha);
    if(d !== null && (masVieja === null || d > masVieja)) masVieja = d;
  });

  var cap = parseInt(l.capacidad, 10) || 0;
  var nota = cap ? (n + " de " + cap) : (n + (n === 1 ? " bolsa" : " bolsas"));
  if(masVieja !== null) nota += " · " + masVieja + "d";

  var lleno = cap ? (n / cap) : (n / 5);
  if(lleno >= 1)  return {fondo:"#F7C1C1", texto:"#791F1F", nota:nota};
  if(lleno >= .6) return {fondo:"#FAC775", texto:"#854F0B", nota:nota};
  return {fondo:"#C0DD97", texto:"#27500A", nota:nota};
}

// Cuantas bolsas hay en cada ambiente y si la proveedora buscada
// tiene algo ahi.
function resumenAmbientes(){
  var out = {};
  if(!S.mapa) return out;
  S.mapa.muebles.forEach(function(m){
    var amb = ambienteDe(m.mueble || m.nombre);
    if(!out[amb]) out[amb] = {bolsas:0, marcado:false, muebles:[]};
    out[amb].muebles.push(m);
    m.lugares.forEach(function(l){
      out[amb].bolsas += l.bolsas.length;
      if(lugarTieneProv(l)) out[amb].marcado = true;
    });
  });
  return out;
}

function colorAmbiente(info){
  if(!info || !info.bolsas) return "#F4F1EB";
  if(info.bolsas >= 12) return "#F7C1C1";
  if(info.bolsas >= 6)  return "#FAC775";
  return "#C0DD97";
}

/* CORREGIDO 23/10: antes el buscador del mapa SOLO miraba nombres de
   proveedora, asi que escribir un lugar ("pasillo", "escritorio") o un
   numero de bolsa no encontraba nada aunque estuviera ahi. Ahora busca
   las dos cosas por separado: el LUGAR y lo que hay guardado adentro. */
function lugarCoincide(l){
  var q = normTxt(S.mapaProv).trim();
  if(!q) return false;
  if(normTxt(l.ubicacion).indexOf(q) > -1) return true;
  if(normTxt(l.mueble).indexOf(q) > -1) return true;
  if(normTxt(ambienteDe(l.mueble)).indexOf(q) > -1) return true;
  return false;
}

function bolsaCoincide(b){
  var q = normTxt(S.mapaProv).trim();
  if(!q) return false;
  if(normTxt(b.proveedora).indexOf(q) > -1) return true;
  if(String(b.provNum).indexOf(q) === 0) return true;
  if(normTxt(b.nro).indexOf(q) > -1) return true;
  return false;
}

function lugarTieneProv(l){
  if(lugarCoincide(l)) return true;
  for(var i = 0; i < l.bolsas.length; i++){ if(bolsaCoincide(l.bolsas[i])) return true; }
  return false;
}

function cargarProvTodas(){
  if(S.provTodas) return Promise.resolve();
  S.provCargandoTodas = true;
  // CORREGIDO 06/10: primero se le pide la lista al servidor, que ya sabe
  // encontrar las columnas de BD_Prov aunque el encabezado tenga un espacio
  // o un acento distinto. Si esa vía falla, se lee la hoja como antes.
  return api("devolProvTodas", {}).then(function(r){
    var lista = ((r && r.proveedoras) || []).filter(function(p){ return p.nombre; });
    if(!lista.length) throw new Error("lista vacia");
    S.provTodas = lista;
    S.provCargandoTodas = false;
  }).catch(function(){
    return cargarProvTodasDeLaHoja();
  });
}

function cargarProvTodasDeLaHoja(){
  return api("getSheet", {sheet:"BD_Prov"}).then(function(r){
    var filas = r.rows || [];
    // Se buscan las columnas sin depender de cómo esté escrito el
    // encabezado: alcanza con que diga "a" y "proveedor", con o sin
    // espacios, mayúsculas o acentos. Antes, un espacio de más en el
    // encabezado dejaba la lista entera sin nombres.
    var kNum = "", kNom = "";
    if(filas.length){
      Object.keys(filas[0]).forEach(function(k){
        var kk = normTxt(k).trim();
        if(!kNum && kk === "a") kNum = k;
        if(!kNom && kk.indexOf("proveedor") === 0) kNom = k;
      });
    }
    var out = [];
    filas.forEach(function(row){
      var num = kNum ? row[kNum] : row["a"];
      if(num === "" || num === undefined || num === null) return;
      var nom = kNom ? row[kNom] : row["Proveedor"];
      out.push({num:String(num).trim(), nombre:String(nom || "").trim()});
    });
    S.provTodas = out;
    S.provCargandoTodas = false;
    if(!out.length || !out.some(function(p){ return p.nombre; })){
      aviso("No se pudieron leer los nombres de BD_Prov. Avisá para revisarlo.", GRAY);
    }
  }).catch(function(e){
    S.provCargandoTodas = false;
    aviso("No se pudo leer la lista de proveedoras: " + e.message, GRAY);
  });
}

function hoyISO(){

  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}

// Cuántos días hace que está esa bolsa.
function diasBolsa(f){
  var d = diasDesde(f);
  return d === null ? null : d;
}

// A los cuántos días una prenda se considera vencida y conviene
// devolverla. Para cambiarlo, se cambia este número.
var DIAS_VENCE = 90;        // 3 meses
var DIAS_POR_VENCER = 75;   // avisa 15 días antes

function textoAntiguedad(f){
  var d = diasBolsa(f);
  if(d === null) return "";
  if(d === 0) return "hoy";
  if(d === 1) return "hace 1 día";
  return "hace " + d + " días";
}

function normTxt(v){
  return String(v || "").toLowerCase()
    .replace(/[áà]/g,"a").replace(/[éè]/g,"e").replace(/[íì]/g,"i")
    .replace(/[óò]/g,"o").replace(/[úù]/g,"u").replace(/ñ/g,"n");
}

// Cuántas letras hay que cambiar para pasar de una palabra a otra.
// Sirve para encontrar "jimenez" cuando escribiste "gimenez".
function distancia(a, b){
  if(a === b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  var fila = [];
  for(var j = 0; j <= b.length; j++) fila[j] = j;
  for(var i = 1; i <= a.length; i++){
    var ant = fila[0]; fila[0] = i;
    for(var k = 1; k <= b.length; k++){
      var tmp = fila[k];
      fila[k] = Math.min(fila[k] + 1, fila[k-1] + 1, ant + (a[i-1] === b[k-1] ? 0 : 1));
      ant = tmp;
    }
  }
  return fila[b.length];
}

// ¿Se parecen dos nombres? Sirve para "Agustina Jimenez" y
// "Agustina Jimenez Lascano", o para "Gimenez" y "Jimenez".
function nombresParecidos(a, b){
  a = normTxt(a).trim(); b = normTxt(b).trim();
  if(!a || !b) return false;
  if(a === b) return true;
  var pa = a.split(" ").filter(function(x){ return x.length > 2; });
  var pb = b.split(" ").filter(function(x){ return x.length > 2; });
  if(!pa.length || !pb.length) return false;

  // Dos palabras son la misma si están escritas igual, o si cambia una
  // sola letra en una palabra larga (jimenez / gimenez). Con palabras
  // cortas no alcanza, si no se mezclan todas las Soles y las Marías.
  function mismaPalabra(x, y){
    if(x === y) return true;
    if(Math.min(x.length, y.length) < 5) return false;
    if(Math.abs(x.length - y.length) > 1) return false;
    return distancia(x, y) <= 1;
  }

  var chico = pa.length <= pb.length ? pa : pb;
  var grande = pa.length <= pb.length ? pb : pa;
  // Si escribiste una sola palabra, alcanza con que sea casi igual a
  // alguna del nombre: así "garlati" encuentra a "Vale Garlatti".
  if(chico.length === 1) return grande.some(function(y){ return mismaPalabra(chico[0], y); });
  return chico.every(function(x){
    return grande.some(function(y){ return mismaPalabra(x, y); });
  });
}

// Filtra al instante, sin ir al servidor. Las que empiezan con lo
// que escribiste van primero.
function provFiltradasLocal(){
  var q = normTxt(S.provBusq).trim();
  if(!q || !S.provTodas) return [];
  var empieza = [], contiene = [];
  for(var i = 0; i < S.provTodas.length; i++){
    var p = S.provTodas[i];
    var n = normTxt(p.nombre), num = String(p.num);
    if(!p.nombre) continue;   // filas numeradas que todavía no tienen nombre
    if(n.indexOf(q) === 0 || num.indexOf(q) === 0) empieza.push(p);
    else if(n.indexOf(q) > -1 || num.indexOf(q) > -1) contiene.push(p);
    if(empieza.length >= 30) break;
  }
  return empieza.concat(contiene).slice(0, 30);
}

  if(S.provCargandoTodas) return '<div class="cargando">Cargando proveedoras…</div>';

         '<div style="font-size:16px;font-weight:600">' + esc(p.num) + ' — ' + esc(p.nombre) + '</div></div>';
  });

  // Parecidas: por si está anotada con otra ortografía, con acento,
  // o con un apellido más. Así no se crea una proveedora repetida.
  if(q.length >= 3 && S.provTodas){
    var parecidas = [];

      var pp = S.provTodas[i];

      if(nombresParecidos(q, pp.nombre)) parecidas.push(pp);

      h += '<p class="conteo" style="margin-top:14px">¿SERÁ ALGUNA DE ESTAS?</p>';
      parecidas.forEach(function(pp){
        h += '<div class="card" data-a="elegiProv" data-num="' + esc(pp.num) + '" data-nom="' + esc(pp.nombre) + '"' +
             ' style="border-color:' + TAN + '55">' +
             '<div style="font-size:16px;font-weight:600">' + esc(pp.num) + ' — ' + esc(pp.nombre) + '</div>' +
             '<div class="prov" style="margin-top:2px">se escribe parecido a lo que buscaste</div></div>';
      });
    }
  }

  // Si no aparece, dos caminos: darla de alta con número, o guardar
  // la bolsa solo con el nombre (ex proveedoras, devoluciones, donaciones).
  if(!lista.length) h += '<div class="cargando">No está en la lista</div>';

  h += '<div class="card" data-a="crearProv" data-nom="' + esc(q) + '" style="border-color:#A77945">' +

       '<div class="prov" style="margin-top:2px">Le asigna el número siguiente y la carga en BD_Prov</div></div>';

  h += '<div class="card" data-a="provSinNumero" data-nom="' + esc(q) + '">' +

       '<div class="prov" style="margin-top:2px">Para ex proveedoras, devoluciones o donación</div></div>';

  return h;
}

  var mio = ++provBId;

  api("devolBolsaBuscar", {q:q}).then(function(r){

    if(mio !== provBId) return;
    S.provLista = []; S.provBuscando = false; render(); aviso(e.message, GRAY);

function ir(screen){
  // Si quedaron prendas elegidas y sin guardar, avisar antes de salir.
  var sinGuardar = Object.keys(S.porGuardar).length;
  if(sinGuardar && screen !== S.screen){
    if(!confirm("Tenés " + sinGuardar + (sinGuardar===1 ? " prenda elegida" : " prendas elegidas") +
                " sin guardar. ¿Salir igual y perderlas?")) return;
    S.porGuardar = {};
  }
  escribiendo = false;              // que nunca quede trabado al cambiar de pantalla
  S.screen = screen; S.error = null; S.ordenAbierto = false;
  S.notaAbierta = null; S.notaTexto = "";
  if(screen === "buscarProv"){ S.provQuery = ""; cargar("provs"); return; }
  if(screen === "devueltas"){ S.devQuery = ""; S.devProv = null; cargar("devs"); return; }
  if(screen === "vencidas"){ cargar("vencidas"); return; }
  if(screen === "pendientes"){ cargar("grupos"); return; }
  if(screen === "revision"){ cargar("revisiones"); return; }
  if(screen === "buscarCodigo"){ S.codQuery = ""; S.resultados = []; }
  if(screen === "deposito"){ S.depQuery = ""; S.depResultados = []; }
  if(screen === "cargarMueble"){ S.bolsaMueble = null; cargarUbicaciones().then(render); }
  if(screen === "mapa"){ cargarMapa(); }
  if(screen === "viejas"){ cargarMapa("viejas"); }
  if(screen === "home") cargarResumen();
  render();
}

function actualizarPrenda(codigo, cambios){
  function ap(l){
    for(var i=0;i<l.length;i++){
      if(l[i].codigo === codigo) for(var k in cambios) l[i][k] = cambios[k];
    }
  }
  ap(S.items); ap(S.resultados); ap(S.revisiones);
}

function marcar(codigo, fila, estado, nota){
  if(S.guardando[codigo]) return;
  S.guardando[codigo] = true; render();
  var params = {codigo:codigo, estado:estado, fila:fila};
  if(nota) params.nota = nota;
  api("devolMarcar", params).then(function(r){
    var cambios = {estado:r.estado};
    if(nota) cambios.nota = nota;
    actualizarPrenda(codigo, cambios);
    S.notaAbierta = null; S.notaTexto = "";
    S.guardando[codigo] = false;
    render();
    if(estado === "Revisar") aviso(codigo + " quedó en Pendientes de revisión");
  }).catch(function(e){
    S.guardando[codigo] = false;
    aviso("No se guardó: " + e.message, GRAY);
    render();
  });
}

// Marca muchas prendas en un solo envío. Mucho más rápido y, sobre todo,
// o se guardan todas o no se guarda ninguna: no quedan a medias.
function marcarVarias(codigos, estado){
  if(!codigos.length || S.guardandoTodas) return;
  S.guardandoTodas = true;
  codigos.forEach(function(c){ S.guardando[c] = true; });
  render();
  api("devolMarcarVarios", {codigos: codigos.join(","), estado: estado}).then(function(r){
    codigos.forEach(function(c){
      actualizarPrenda(c, {estado: r.estado});
      S.guardando[c] = false;
      delete S.porGuardar[c];
    });
    S.guardandoTodas = false;
    render();
    var faltan = (r.noEncontradas || []).length;
    aviso(r.cambiadas + (r.cambiadas===1 ? " prenda marcada" : " prendas marcadas") +
          (r.yaEstaban ? " · " + r.yaEstaban + " ya estaban" : "") +
          (faltan ? " · " + faltan + " no se encontraron" : ""));
  }).catch(function(e){
    codigos.forEach(function(c){ S.guardando[c] = false; });
    S.guardandoTodas = false;
    render();
    aviso("No se guardó ninguna: " + e.message + ". Probá de nuevo.", GRAY);
  });
}

function yaAvise(num){

    S.grupos = S.grupos.filter(function(g){ return String(g.num) !== String(num); });

}

/* ---------------- orden ---------------- */
function provsFiltradas(){
  var q = S.provQuery.trim().toLowerCase();
  var l = S.provs.filter(function(p){
    if(!q) return true;
    return String(p.num).indexOf(q) > -1 || p.nombre.toLowerCase().indexOf(q) > -1;
  });
  var o = S.ordenProv;
  return l.slice().sort(function(a,b){
    if(o==="nombre-za")     return b.nombre.localeCompare(a.nombre);
    if(o==="mas-prendas")   return b.cantidad - a.cantidad;
    if(o==="menos-prendas") return a.cantidad - b.cantidad;
    if(o==="ingreso-viejo") return String(a.primerIngreso).localeCompare(String(b.primerIngreso));
    if(o==="ingreso-nuevo") return String(b.primerIngreso).localeCompare(String(a.primerIngreso));
    return a.nombre.localeCompare(b.nombre);
  });
}
function itemsOrdenados(){
  if(S.ordenItems === "original") return S.items;
  var signo = S.ordenItems === "ingreso-nuevo" ? -1 : 1;
  return S.items.slice().sort(function(a,b){
    return String(a.fecha).localeCompare(String(b.fecha)) * signo;
  });
}

function vPrenda(it, mostrarProv){
  var busy = !!S.guardando[it.codigo];
  var estado = it.estado || "";
  var h = '<div class="prenda' + (busy?' busy':'') + '">' +
    '<div class="fila"><div class="cod">' + esc(it.codigo) + '</div>' +
    '<span class="tag" style="background:' + colorEstado(estado) + '22;color:' + colorEstado(estado) + '">' +
    esc(estado || STOCK) + '</span></div>' +
    '<div class="prod">' + esc(it.producto) + '</div>';
  if(mostrarProv) h += '<div class="prov">' + esc(it.provNum) + ' — ' + esc(it.proveedor) + '</div>';
  if(it.fecha){
    var dias = diasDesde(it.fecha);
    var extra = "";
    var gestionable = (estado !== "Vendida" && estado !== "Reservada");
    if(dias !== null && gestionable){
      if(dias >= DIAS_VENCE){
        extra = ' <span style="color:' + CARAMELO + ';font-weight:600">· VENCIDA, ' +
                Math.floor(dias/30) + ' meses acá</span>';
      } else if(dias >= DIAS_POR_VENCER){
        extra = ' <span style="color:' + TAN + '">· por vencer, le quedan ' + (DIAS_VENCE - dias) + ' días</span>';
      } else {
        extra = ' <span style="color:' + GRAY + '">· ' + textoAntiguedad(it.fecha) + '</span>';
      }
    }
    h += '<div class="fecha">Ingresó ' + fechaCorta(it.fecha) + extra + '</div>';
  }
  if(it.nota && S.notaAbierta !== it.codigo) h += '<div class="nota">' + esc(it.nota) + '</div>';

  // Una prenda vendida no se toca desde acá: las ventas se cargan en la app de
  // ventas y dejarla editable permitiría "desvender" algo sin querer.
  if(estado === "Vendida"){
    return h + '<div class="nota" style="margin:0">Vendida. Se gestiona desde la app de ventas.</div></div>';
  }

  // Reservada: la clienta la separó y todavía no la pagó. La condición se
  // cambia en la app de ventas, no acá, para no romper el saldo de la proveedora.
  if(estado === "Reservada"){
    return h + '<div class="nota" style="margin:0;border-left:3px solid #9A7040">' +
           'Reservada. Se gestiona desde la app de ventas.</div></div>';
  }

  h += '<div class="estados">';
  ["Devuelta","Última Oportunidad","Revisar"].forEach(function(v){
    var elegida = (v === "Devuelta") && !!S.porGuardar[it.codigo];
    var on = estado === v || elegida, c = ESTADOS[v].color;
    // "Devuelta" no se manda sola: queda elegida y se guardan todas juntas
    // con el botón de abajo. Así, si una prenda no aparece, no la marcás.
    var accion = v === "Revisar" ? "abrirNota" : (v === "Devuelta" ? "elegirDevuelta" : "marcar");
    h += '<button class="eb" data-a="' + accion + '" data-cod="' + esc(it.codigo) +
         '" data-fila="' + esc(it.fila) + '" data-estado="' + esc(v) + '" style="' +
         (on ? 'background:' + c + ';color:#fff;border:none' : 'color:' + c + ';border:1px solid ' + c + '55') +
         '">' + (elegida ? '✓ ' : '') + ESTADOS[v].label + '</button>';
  });
  h += '</div>';
  if(S.porGuardar[it.codigo]) h += '<div class="nota" style="margin:6px 0 0;border-left:3px solid ' +
      ESTADOS["Devuelta"].color + '">Elegida. Falta guardarla con el botón de abajo.</div>';

  if(estado) h += '<button class="stock-btn" data-a="marcar" data-cod="' + esc(it.codigo) +
                  '" data-fila="' + esc(it.fila) + '" data-estado="' + STOCK + '">Volver a stock</button>';

  if(S.notaAbierta === it.codigo){
    h += '<div class="campo"><div class="titulo">¿Qué hay que revisar?</div>' +
         '<input id="notaInput" value="' + esc(S.notaTexto) +
         '" placeholder="Ej: no encuentro la prenda, tiene una mancha, código incorrecto…">' +
         '<div class="acciones">' +
         '<button class="guardar" data-a="guardarNota" data-cod="' + esc(it.codigo) + '" data-fila="' + esc(it.fila) + '">Guardar</button>' +
         '<button class="cancelar" data-a="cancelarNota">Cancelar</button></div></div>';
  }
  return h + '</div>';
}

function vElegirLugar(accion){
  accion = accion || "lugar";
  var h = '';
  if(!S.bolsaMueble){
    S.ubicaciones.forEach(function(m){
      h += '<div class="card" data-a="mueble" data-m="' + esc(m.nombre) + '">' +
           '<div style="font-size:16px">' + esc(m.nombre) + '</div>' +
           '<div class="prov" style="margin-top:2px">' + m.lugares.length + ' lugares</div></div>';
    });
    if(!S.ubicaciones.length) h += '<div class="vacio">No hay lugares cargados en la hoja Ubicaciones.</div>';
  } else {
    var m = S.ubicaciones.filter(function(x){ return x.nombre === S.bolsaMueble; })[0];
    h += '<p class="conteo">' + esc(S.bolsaMueble).toUpperCase() + '</p>';
    if(m) m.lugares.forEach(function(l){
      h += '<div class="card" data-a="' + accion + '" data-m="' + esc(l.mueble) + '" data-u="' + esc(l.ubicacion) + '">' +
           '<div style="font-size:16px">' + esc(l.ubicacion) + '</div>' +
           '<div class="prov" style="margin-top:2px">' +
           (l.bolsas ? l.bolsas + (l.bolsas===1?' bolsa':' bolsas') : 'vacío') + '</div></div>';
    });
    h += '<button class="volver" data-a="mueble" data-m="">← Otro mueble</button>';
  }
  return h;
}

function vListaEstado(vacioTexto, contenido){
  if(S.cargando) return '<div class="cargando">Cargando…</div>';
  if(S.error) return '<div class="errorbox"><div>' + esc(S.error) +
    '</div><button data-a="reintentar">Reintentar</button></div>';
  if(!contenido) return '<div class="vacio">' + esc(vacioTexto) + '</div>';
  return contenido;
}

  if(qd){ qd.focus(); qd.setSelectionRange(qd.value.length, qd.value.length); }
  var qd2 = document.getElementById("qDev");
  if(qd2){ qd2.focus(); qd2.setSelectionRange(qd2.value.length, qd2.value.length); }
  var qm = document.getElementById("qMapa");
  if(qm){ qm.focus(); qm.setSelectionRange(qm.value.length, qm.value.length); }
  var ni = document.getElementById("notaInput");
  if(ni){ ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); }

  if(!S.cargando) escribiendo = false;
}

/* ---------------- eventos ---------------- */
var timerBusqueda = null, busquedaId = 0;

function refrescarCod(){
  var c = document.getElementById("listaCod");
  if(c) c.innerHTML = htmlListaCod(); else render();
}

document.addEventListener("input", function(ev){
  var t = ev.target;
  if(t.id === "qProv"){
    S.provQuery = t.value;
    var cont = document.getElementById("listaProv");
    if(cont) cont.innerHTML = htmlListaProv(); else render();
    return;
  }
  if(t.id === "fechaBolsa"){ S.bolsaFecha = t.value; return; }
  if(t.id === "qDev"){
    S.devQuery = t.value; render(); return;
  }
  if(t.id === "qMapa"){ S.mapaProv = t.value; render(); return; }
  if(t.id === "notaInput"){ S.notaTexto = t.value; return; }
  if(t.id === "bolsaCant"){ S.bolsaCantidad = t.value; return; }
  if(t.id === "bolsaNota"){ S.bolsaNotas = t.value; return; }
  if(t.id === "qProvB"){
    S.provBusq = t.value;
    var contPB = document.getElementById("listaProvBolsa");
    if(contPB) contPB.innerHTML = htmlListaProvBolsa(); else render();
    return;
  }
  if(t.id === "qDep"){
    S.depQuery = t.value;
    if(timerDep) clearTimeout(timerDep);
    var qd = t.value;
    timerDep = setTimeout(function(){ buscarDeposito(qd); }, 450);
    return;
  }
  if(t.id === "qCod"){
    S.codQuery = t.value;
    var q = t.value.trim();
    if(timerBusqueda) clearTimeout(timerBusqueda);
    if(q.length < 2){ S.resultados = []; S.buscando = false; refrescarCod(); return; }
    S.buscando = true; refrescarCod();
    var mio = ++busquedaId;
    timerBusqueda = setTimeout(function(){
      api("devolBuscar", {q:q}).then(function(r){
        if(mio !== busquedaId) return;
        S.resultados = r.prendas; S.buscando = false; refrescarCod();
      }).catch(function(){
        if(mio !== busquedaId) return;
        S.resultados = []; S.buscando = false; refrescarCod();
      });
    }, 450);
  }
});

/* Acciones que escriben en el Sheet. Mientras una está en curso,
   los toques siguientes se ignoran: apretar quince veces guarda
   una sola bolsa, no quince. */
var ACC_ESCRIBEN = {elegiTipo:1, entregar:1, entregarTodo:1, anular:1, mover:1,
                    marcar:1, guardarNota:1, yaAvise:1};
var escribiendo = false;

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-a]");
  if(!el) {
    if(S.ordenAbierto){ S.ordenAbierto = false; render(); }
    return;
  }
  var a = el.getAttribute("data-a");

  if(ACC_ESCRIBEN[a]){
    if(escribiendo) return;          // ya hay una guardando: no duplicar
    escribiendo = true;
    el.classList.add("apretado");    // se apaga al toque, sin esperar
    setTimeout(function(){ escribiendo = false; }, 6000); // red de seguridad
  }

  if(a === "escanear"){ abrirCamara(); return; }

  if(a === "secSel"){ S.secSel = parseInt(el.getAttribute("data-i"), 10); render(); return; }
  if(a === "secCerrar"){ S.secSel = null; render(); return; }
  if(a === "ambDetalle"){
    S.ambDetalle = el.getAttribute("data-amb");
    S.secSel = null; render(); return;
  }
  if(a === "planoCompleto"){ S.ambDetalle = null; S.secSel = null; render(); return; }
  if(a === "vencMeses"){ S.vencMeses = parseInt(el.getAttribute("data-m"),10) || 0; render(); return; }
  if(a === "limpiarBusq"){ S.mapaProv = ""; render(); return; }
  if(a === "verEnPlano"){
    S.mapaProv = el.getAttribute("data-nom") || "";
    S.ambDetalle = null; S.secSel = null;
    cargarMapa("mapa");
    return;
  }

  if(a === "abrirAmb"){
    S.ambSel = el.getAttribute("data-amb");
    S.screen = "ambiente"; render();
    return;
  }

  if(a === "abrirMueble"){
    S.ambSel = el.getAttribute("data-amb");
    S.muebleSel = el.getAttribute("data-m");
    S.screen = "ambiente"; render();
    return;
  }


  if(a === "ir"){ S.muebleSel = null; ir(el.getAttribute("data-s")); return; }

  if(a === "atras"){
    if(S.screen === "itemsProv") ir("buscarProv");
    else if(S.screen === "editarBolsa"){ S.editBolsa = null; S.screen = "lugar"; render(); }
    else if(S.screen === "lugar") ir("cargarMueble");
    else if(S.screen === "elegirProv") { S.screen = "lugar"; render(); }
    else if(S.screen === "elegirTipo"){
      if(S.origenCarga === "lugar"){ S.screen = "elegirProv"; render(); }
      else if(S.prov){ S.screen = "itemsProv"; render(); }
      else ir("deposito");
    }
    else if(S.screen === "elegirLugarNueva"){ S.screen = "elegirTipo"; render(); }
    else if(S.screen === "cantBolsas"){ S.screen = "elegirTipo"; render(); }
    else if(S.screen === "mover" || S.screen === "cargarMueble") ir("deposito");
    else if(S.screen === "ambiente"){ S.muebleSel = null; S.screen = "mapa"; render(); }
    else if(S.screen === "viejas") ir("menuDep");
    else if(S.screen === "mapa" || S.screen === "deposito" ||
            S.screen === "pendientes" || S.screen === "revision") ir("menuDep");
    else if(S.screen === "devueltas"){
      if(S.devProv){ S.devProv = null; render(); } else ir("menuDevol");
    }
    else if(S.screen === "buscarCodigo" || S.screen === "buscarProv") ir("menuDevol");
    else ir("home");
    return;
  }

  if(a === "abrirLugar"){
    S.origenCarga = "lugar";
    S.lugarSel = {mueble:el.getAttribute("data-m"), ubicacion:el.getAttribute("data-u")};
    cargarMapa("lugar");
    return;
  }

  if(a === "agregarAca"){
    S.origenCarga = "lugar";
    S.nueva = {prov:null, tipo:null, mueble:S.lugarSel.mueble, ubicacion:S.lugarSel.ubicacion};
    S.provBusq = ""; S.provLista = []; S.bolsaCantidad = ""; S.bolsaFecha = hoyISO();
    S.screen = "elegirProv"; render();
    cargarProvTodas().then(render);
    return;
  }

  if(a === "abrirBolsa" || a === "nuevaBolsa"){
    S.origenCarga = "prov";
    var num = el.getAttribute("data-num");
    var nom = el.getAttribute("data-nom") || (S.prov ? S.prov.nombre : num);
    S.nueva = {prov:{num:num, nombre:nom}, tipo:null, mueble:null, ubicacion:null};
    S.bolsaCantidad = "";
    S.screen = "elegirTipo"; render();
    return;
  }

  // FALTABA: abrir y cerrar el desplegable de "Ordenar".
  if(a === "devProv"){
    S.devProv = {num: el.getAttribute("data-num"), nombre: el.getAttribute("data-nom") || ""};
    render(); return;
  }
  if(a === "devTodas"){ S.devProv = null; render(); return; }
  if(a === "editarBolsa"){
    var nroE = el.getAttribute("data-nro");
    var enc = bolsasDelLugar().filter(function(x){ return x.nro === nroE; })[0];
    if(!enc){ aviso("No se encontró esa bolsa", GRAY); return; }
    S.editBolsa = JSON.parse(JSON.stringify(enc));
    S.screen = "editarBolsa"; render();
    return;
  }

  if(a === "edTipo"){
    if(S.editBolsa) S.editBolsa.tipo = el.getAttribute("data-t");
    render(); return;
  }

  if(a === "guardarEdicion"){
    if(escribiendo) return;
    escribiendo = true;
    el.classList.add("apretado");
    var eb2 = S.editBolsa || {};
    var params = {
      bolsa: eb2.nro,
      nroNuevo: (document.getElementById("edNro") || {}).value || "",
      fecha: (document.getElementById("edFecha") || {}).value || "",
      tipo: eb2.tipo || "",
      cantidad: (document.getElementById("edCant") || {}).value || "",
      bolsasFisicas: (document.getElementById("edBolsas") || {}).value || "",
      notas: (document.getElementById("edNotas") || {}).value || ""
    };
    S.cargando = true; render();
    api("devolBolsaEditar", params).then(function(r){
      aviso("Bolsa " + r.nro + " actualizada");
      S.editBolsa = null; S.screen = "lugar";
      cargarMapa("lugar");
    }).catch(function(e){
      S.cargando = false; escribiendo = false; render();
      aviso("No se pudo: " + e.message, GRAY);
    });
    return;
  }

  if(a === "lleno"){
    if(escribiendo) return;
    escribiendo = true;
    el.classList.add("apretado");
    var lu2 = S.lugarSel || {};
    var nuevo = lugarLleno(lu2.mueble, lu2.ubicacion) ? "" : "SI";
    api("devolLleno", {mueble: lu2.mueble || "", ubicacion: lu2.ubicacion, valor: nuevo})
      .then(function(){
        aviso(nuevo ? "Lugar marcado como lleno" : "Lugar liberado");
        cargarMapa("lugar");
      })
      .catch(function(e){ escribiendo = false; aviso("No se pudo: " + e.message, GRAY); });
    return;
  }

  if(a === "viejasDias"){ S.viejasDias = parseInt(el.getAttribute("data-d"), 10) || 0; render(); return; }

  if(a === "abrirOrden"){
    S.ordenAbierto = !S.ordenAbierto;
    render();
    return;
  }

  // FALTABA: elegir una opción de orden.
  if(a === "orden"){
    var tipoOrd = el.getAttribute("data-tipo");
    var idOrd = el.getAttribute("data-id");
    if(tipoOrd === "prov") S.ordenProv = idOrd;
    else S.ordenItems = idOrd;
    S.ordenAbierto = false;
    render();
    return;
  }

  // FALTABA: cerrar el cuadro de nota sin guardar.
  if(a === "cancelarNota"){
    S.notaAbierta = null;
    S.notaTexto = "";
    render();
    return;
  }

  if(a === "elegirVencidas"){
    itemsOrdenados().forEach(function(it){
      var e = String(it.estado || "");
      if(e === "Vendida" || e === "Reservada" || e === "Devuelta") return;
      var d = diasDesde(it.fecha);
      if(d !== null && d >= DIAS_VENCE) S.porGuardar[it.codigo] = true;
    });
    render();
    return;
  }

  if(a === "elegirDevuelta"){
    var codE = el.getAttribute("data-cod");
    if(S.guardandoTodas) return;
    if(S.porGuardar[codE]) delete S.porGuardar[codE];
    else S.porGuardar[codE] = true;
    render();
    return;
  }

  if(a === "guardarDevueltas"){
    var codigos = Object.keys(S.porGuardar);
    if(!codigos.length) return;
    marcarVarias(codigos, "Devuelta");
    return;
  }

  // FALTABA: al tocar una proveedora en la lista, entrar a sus prendas.
  if(a === "verProv"){
    S.prov = {num: el.getAttribute("data-num"), nombre: el.getAttribute("data-nom") || ""};
    S.items = [];
    S.screen = "itemsProv";
    cargar("items");
    return;
  }

  if(a === "crearProv"){
    if(escribiendo) return;
    escribiendo = true;
    el.classList.add("apretado");
    var nomC = el.getAttribute("data-nom") || "";
    api("devolCrearProv", {nombre: nomC}).then(function(r){
      escribiendo = false;
      S.provTodas = null;                    // que vuelva a bajar la lista
      aviso(r.yaExistia ? "Ya existía como #" + r.num : "Creada como #" + r.num);
      S.nueva.prov = {num: r.num, nombre: r.nombre};
      S.screen = "elegirTipo"; render();
    }).catch(function(e){
      escribiendo = false;
      aviso("No se pudo crear: " + e.message, GRAY);
    });
    return;
  }

  if(a === "provSinNumero"){
    S.nueva.prov = {num: "", nombre: el.getAttribute("data-nom") || ""};
    S.screen = "elegirTipo"; render();
    return;
  }

  if(a === "elegiProv"){
    S.nueva.prov = {num:el.getAttribute("data-num"), nombre:el.getAttribute("data-nom")};
    S.screen = "elegirTipo"; render();
    return;
  }

  if(a === "elegiTipo"){
    S.nueva.tipo = el.getAttribute("data-t");
    if(S.nueva.ubicacion){ escribiendo = false; S.screen = "cantBolsas"; render(); }
    else { S.bolsaMueble = null; cargarUbicaciones().then(function(){ S.screen = "elegirLugarNueva"; render(); }); }
    return;
  }

  if(a === "lugarNueva"){
    S.nueva.mueble = el.getAttribute("data-m");
    S.nueva.ubicacion = el.getAttribute("data-u");
    S.screen = "cantBolsas"; render();
    return;
  }

  if(a === "elegiCant"){
    if(escribiendo || S.guardandoBolsa) return;
    escribiendo = true;
    el.classList.add("apretado");
    crearVariasBolsas(el.getAttribute("data-n"));
    return;
  }

  if(a === "mueble"){ S.bolsaMueble = el.getAttribute("data-m") || null; render(); return; }

  if(a === "mover"){
    S.moverBolsa = el.getAttribute("data-nro"); S.bolsaMueble = null;
    cargarUbicaciones().then(function(){ S.screen = "mover"; render(); });
    return;
  }

  if(a === "lugarMover"){ moverBolsa(el.getAttribute("data-u"), el.getAttribute("data-m")); return; }

  if(a === "refrescar"){
    api("devolRefrescar").then(function(){
      S.provs = []; S.items = []; S.mapa = null; S.ubicaciones = [];
      S.depResultados = []; S.grupos = []; S.revisiones = [];
      aviso("Datos actualizados");
      cargarResumen();
    }).catch(function(e){ aviso(e.message, GRAY); });
    return;
  }

  if(a === "entregar"){ entregarBolsa(el.getAttribute("data-nro")); return; }

  if(a === "anular"){
    var nro = el.getAttribute("data-nro");
    if(!window.confirm("¿Eliminar la bolsa " + nro + " de " + (el.getAttribute("data-nom")||"") +
       "?\n\nEs para cuando se cargó mal. Sus prendas vuelven a quedar sin bolsa.")) return;
    api("devolBolsaAnular", {bolsa:nro}).then(function(r){
      aviso("Bolsa " + r.nro + " eliminada");
      S.ubicaciones = [];
      if(S.screen === "lugar") cargarMapa("lugar");
      else buscarDeposito(S.depQuery, true);
    }).catch(function(e){ aviso("No se pudo: " + e.message, GRAY); });
    return;
  }
  if(a === "entregarTodo"){ entregarTodo(el.getAttribute("data-num"), el.getAttribute("data-nom")); return; }

  if(a === "yaAvise"){ yaAvise(el.getAttribute("data-num")); return; }

  if(a === "copiar" || a === "wa"){
    var n = el.getAttribute("data-num");
    var g = S.grupos.filter(function(x){ return String(x.num) === String(n); })[0];
    if(!g) return;
    if(a === "copiar") copiar(mensajeWa(g));
    else window.open("https://wa.me/" + g.wa + "?text=" + encodeURIComponent(mensajeWa(g)), "_blank");
    return;
  }

  if(a === "reintentar"){
    if(S.screen === "buscarProv") cargar("provs");
    else if(S.screen === "itemsProv") cargar("items");
    else if(S.screen === "pendientes") cargar("grupos");
    else if(S.screen === "revision") cargar("revisiones");
    return;
  }
});

document.addEventListener("keydown", function(ev){
  if(ev.key === "Enter" && ev.target.id === "notaInput"){
    var b = document.querySelector('[data-a="guardarNota"]');
    if(b) b.click();
  }
});

/* ============================================================
   ENTRADA POR QR
   El QR de cada estante abre esta misma app con la ubicacion
   en la direccion, por ejemplo:
     ...index.html?u=Estante%204&m=Placard%20escritorio%20espejo
   Si viene con ?u=, salteamos el menu y abrimos ese lugar
   directo. Si no viene nada, la app arranca como siempre.
   ============================================================ */
function paramUrl(nombre){
  var m = new RegExp("[?&]" + nombre + "=([^&#]*)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
}

function abrirLugarDesdeQR(){
  var u = paramUrl("u");
  if(!u) return false;
  var m = paramUrl("m");

  S.lugarSel = {mueble:m, ubicacion:u};
  S.screen = "lugar";
  S.cargando = true;
  render();

  api("devolMapa").then(function(r){
    S.mapa = r;
    S.cargando = false;
    // Corrige el nombre del mueble si el QR quedó con uno viejo.
    normalizarLugarSel();
    // Chequear que el lugar exista de verdad en la hoja Ubicaciones.
    var existe = false;
    r.muebles.forEach(function(mu){
      mu.lugares.forEach(function(l){
        if(l.mueble === S.lugarSel.mueble && l.ubicacion === S.lugarSel.ubicacion) existe = true;
      });
    });
    render();
    if(!existe) aviso("Ese lugar no figura en la hoja Ubicaciones", GRAY);
  }).catch(function(e){
    S.cargando = false; render();
    aviso("No se pudo leer el depósito: " + e.message, GRAY);
  });
  return true;
}

document.getElementById("camCerrar").addEventListener("click", cerrarCamara);

if(!abrirLugarDesdeQR()){
  render();
  cargarResumen();
}
