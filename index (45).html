<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ainhoa · Cargar Venta</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f7;
  --bg2: #f3f1ed;
  --bg3: #ece9e3;
  --border: #ddd9d0;
  --dark: #1a1712;
  --brown: #6b5c3e;
  --gold: #9a7e42;
  --text: #3a3228;
  --muted: #9e8f7a;
  --green: #4a7c59;
  --green-bg: #edf5f0;
  --green-border: #c0ddc9;
  --red: #b85c5c;
  --red-bg: #f8eeee;
  --red-border: #e6c9c9;
  --amber: #8a6a1f;
  --amber-bg: #fbf4e4;
  --amber-border: #eddcb2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; }

header { background: var(--dark); padding: 20px 24px 16px; text-align: center; }
.brand { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: #f0ead8; letter-spacing: 0.18em; text-transform: uppercase; }
.brand-sub { font-size: 10px; letter-spacing: 0.28em; color: #e8d08a; text-transform: uppercase; margin-top: 3px; }

main { max-width: 600px; margin: 0 auto; padding: 28px 16px 60px; }

#login-screen { display: flex; flex-direction: column; align-items: center; padding-top: 40px; }
.login-box {
  background: #fff; border: 1px solid var(--border); border-radius: 10px;
  padding: 36px 32px; width: 100%; max-width: 380px;
  display: flex; flex-direction: column; gap: 18px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.05);
}
.login-box h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--dark); text-align: center; }

#app { display: none; }
.section-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 14px; }
.section-card h3 {
  font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 300;
  color: var(--dark); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
}

.input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.input-group:last-child { margin-bottom: 0; }
.form-row > .input-group, .form-row > .input-group:last-child { margin-bottom: 14px; }
.input-group label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

input[type="text"], input[type="number"], input[type="password"], select {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  color: var(--dark); font-family: 'DM Sans', sans-serif; font-size: 15px;
  padding: 11px 13px; width: 100%; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none; appearance: none;
}
input:focus, select:focus { border-color: var(--brown); }
input::placeholder { color: var(--muted); }
input[readonly] { color: var(--brown); background: var(--bg3); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

.ayuda { font-size: 12px; color: var(--brown); margin-top: -6px; margin-bottom: 12px; min-height: 0; }
.ayuda:empty { display: none; }

.prenda-preview { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 10px; padding: 16px; margin-bottom: 14px; display: none; }
.prenda-preview .cod { font-size: 10px; letter-spacing: 0.14em; color: var(--gold); font-weight: 500; text-transform: uppercase; margin-bottom: 4px; }
.prenda-preview .desc { font-size: 14px; color: var(--dark); font-weight: 500; margin-bottom: 8px; }
.prenda-preview .meta { display: flex; gap: 16px; flex-wrap: wrap; }
.prenda-preview .meta span { font-size: 12px; color: var(--muted); }
.prenda-preview .meta strong { color: var(--dark); }

.estado { display: inline-block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; padding: 3px 8px; border-radius: 20px; margin-left: 6px; vertical-align: middle; }
.estado.stock { background: #fff; color: var(--green); border: 1px solid var(--green-border); }
.estado.vendida, .estado.devuelta { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.estado.otro { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }

.aviso { font-size: 13px; padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; }
.aviso.rojo { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.aviso.ambar { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }

button.primary {
  background: var(--dark); border: none; border-radius: 10px; color: #f0ead8; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.16em;
  padding: 14px; text-transform: uppercase; width: 100%; transition: background 0.2s;
}
button.primary:hover { background: #2e2a22; }
button.primary:disabled { background: var(--muted); cursor: not-allowed; }
button.secondary {
  background: none; border: 1px solid var(--border); border-radius: 10px; color: var(--text); cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: 0.14em; padding: 10px 18px;
  text-transform: uppercase; transition: border-color 0.2s;
}
button.secondary:hover { border-color: var(--brown); }

.error-msg { font-size: 12px; color: var(--red); text-align: center; min-height: 16px; }
.success-msg { font-size: 13px; color: var(--green); padding: 12px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 10px; text-align: center; }

.app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.app-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300; color: var(--dark); }

.reciente-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.reciente-item:last-child { border-bottom: none; }
.reciente-cod { font-size: 10px; color: var(--gold); font-weight: 500; letter-spacing: 0.1em; margin-bottom: 2px; }
.reciente-desc { color: var(--dark); }
.reciente-right { text-align: right; flex-shrink: 0; }
.reciente-importe { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--dark); }
.reciente-fecha { font-size: 10px; color: var(--muted); }

.loader { display: flex; align-items: center; gap: 10px; padding: 20px 0; color: var(--muted); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--brown); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }

.item { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.item-cod { font-size: 10px; letter-spacing: 0.12em; color: var(--gold); font-weight: 500; text-transform: uppercase; }
.item-desc { font-size: 14px; color: var(--dark); margin-top: 2px; }
.item-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.item-quitar { background: none; border: 1px solid var(--border); border-radius: 50%; width: 30px; height: 30px; flex-shrink: 0; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
.item-quitar:hover { border-color: var(--red); color: var(--red); }
.item-precios { display: grid; grid-template-columns: 1fr 0.8fr 1.2fr; gap: 8px; align-items: end; }
.item-precios label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.item-lista { font-size: 14px; color: var(--brown); padding: 11px 0; white-space: nowrap; }
.item-precios input { padding: 9px 10px; font-size: 15px; }
.item-nota { font-size: 11px; color: var(--brown); margin-top: 6px; }
.item-nota:empty { display: none; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 16px; margin-bottom: 14px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.total span { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.total strong { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 400; color: var(--dark); }
.agregado { font-size: 13px; color: var(--green); margin-bottom: 10px; }
.agregado:empty { display: none; }
</style>
</head>
<body>

<header>
  <div class="brand">ainhoa</div>
  <div class="brand-sub">Cargar Venta</div>
</header>

<main>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h2>Acceso</h2>
    <div class="input-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="primary" onclick="doLogin()" id="btn-login">Ingresar</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <h2>Nueva venta</h2>
    <button class="secondary" onclick="doLogout()">Salir</button>
  </div>

  <!-- AGREGAR PRENDAS -->
  <div class="section-card">
    <h3>Agregar prenda</h3>
    <div class="input-group">
      <label>Código</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="codigo" placeholder="Ej: 103-3" style="flex:1;" autocomplete="off" onkeydown="if(event.key==='Enter') agregarPrenda()">
        <button class="secondary" onclick="agregarPrenda()" id="btn-agregar" style="white-space:nowrap;padding:11px 16px;">Agregar</button>
      </div>
    </div>
    <div id="buscar-loader" style="display:none;" class="loader"><div class="spinner"></div><span>Buscando...</span></div>
    <div class="agregado" id="agregado"></div>
    <div id="estado-aviso"></div>
    <div class="error-msg" id="buscar-error"></div>
  </div>

  <!-- RESERVA PENDIENTE -->
  <div class="section-card" id="reserva-card" style="display:none;">
    <h3>Reserva sin pagar · <span id="reserva-cod"></span></h3>
    <div class="aviso ambar" id="reserva-info"></div>
    <div class="form-row">
      <div class="input-group">
        <label>Medio de pago</label>
        <select id="reserva-medio" onchange="reservaCambioMedio()">
          <option value="Transferencia">Transferencia</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Tarjeta">Tarjeta</option>
        </select>
      </div>
      <div class="input-group">
        <label>Importe final ($)</label>
        <input type="number" id="reserva-importe">
      </div>
    </div>
    <div class="ayuda">Al confirmar, esa misma venta pasa a Vendido y la prenda queda Vendida.</div>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="secondary" onclick="cerrarReserva()" style="flex:1;">Cerrar</button>
      <button class="primary" onclick="confirmarReserva()" id="btn-reserva" style="flex:2;">Confirmar pago</button>
    </div>
    <div style="margin-top:12px;" id="reserva-feedback"></div>
  </div>

  <!-- CARRITO -->
  <div class="section-card" id="form-venta" style="display:none;">
    <h3>Venta</h3>

    <div class="form-row">
      <div class="input-group">
        <label>Cliente (@ o nombre)</label>
        <input type="text" id="venta-cliente" placeholder="@instagram">
      </div>
      <div class="input-group">
        <label>Medio de pago</label>
        <select id="venta-medio" onchange="actualizarPrecios()">
          <option value="">Seleccionar</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Tarjeta">Tarjeta</option>
        </select>
      </div>
    </div>

    <div id="carrito"></div>

    <div class="total"><span id="total-label">Total</span><strong id="total">$0</strong></div>

    <div class="form-row" style="align-items:flex-end;">
      <div class="input-group">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="venta-pago-completo" checked onchange="togglePagoParcial()" style="width:auto;">
          Pago completo
        </label>
      </div>
      <div class="input-group" id="wrap-monto-pagado" style="display:none;">
        <label>Monto pagado ahora ($)</label>
        <input type="number" id="venta-monto-pagado" placeholder="0" oninput="mostrarSaldoCliente()">
      </div>
    </div>
    <div class="ayuda" id="saldo-cliente-info"></div>

    <div class="form-row">
      <div class="input-group">
        <label>Condición</label>
        <select id="venta-condicion">
          <option value="Vendido">Vendido</option>
          <option value="Reservado">Reservado (no pagó)</option>
          <option value="No vendido">No vendido</option>
        </select>
      </div>
      <div class="input-group">
        <label>Envío / Retiro</label>
        <select id="venta-envio">
          <option value="">—</option>
          <option value="Envío">Envío</option>
          <option value="Retiro">Retiro</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="input-group">
        <label>Fecha</label>
        <input type="text" id="venta-fecha" readonly>
      </div>
      <div class="input-group">
        <label>Notas (opcional)</label>
        <input type="text" id="venta-notas" placeholder="Ej: falta pagar 1000...">
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="secondary" onclick="resetForm()" style="flex:1;">Cancelar</button>
      <button class="primary" onclick="guardarVenta()" id="btn-guardar" style="flex:2;">Guardar venta</button>
    </div>
    <div style="margin-top:12px;" id="guardar-feedback"></div>
  </div>

  <!-- VENTAS RECIENTES -->
  <div class="section-card">
    <h3>Últimas ventas cargadas</h3>
    <div id="recientes-loader" class="loader"><div class="spinner"></div><span>Cargando...</span></div>
    <div id="recientes-list"></div>
  </div>
</div>
</main>

<script>

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZbEeODB-LF71H32WLSJafEKpl4sQNzMEiNQ2nvxK6LjNc1pmX0NMEbKSi5s7EXk9d/exec';
const FACTOR_RECARGO = 0.85;   // precio transf/tarjeta = efectivo / 0,85

// El carrito: una entrada por prenda.
//   desc   = descuento escrito para esa prenda ("20", "20%"...)
//   manual = precio escrito a mano (si no, se calcula solo)
let carrito = [];
let reservaActual = null;
let prendaReserva = null;

function el(id) { return document.getElementById(id); }

async function api(action, params = {}) {
  const url = new URL(APPS_SCRIPT_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  return res.json();
}

function fmt(n) {
  if (!n && n !== 0) return '—';
  return '$' + Math.round(n).toLocaleString('es-AR');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fechaHoy() {
  const d = new Date();
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}

function conRecargo(medio) { return medio === 'Transferencia' || medio === 'Tarjeta'; }

// ---------- LOGIN ----------
async function doLogin() {
  const pass = el('login-pass').value;
  const errEl = el('login-error');
  const btn = el('btn-login');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Verificando...';
  try {
    const res = await api('checkAdminPass', { pass });
    if (res && res.ok) {
      el('login-screen').style.display = 'none';
      el('app').style.display = 'block';
      el('venta-fecha').value = fechaHoy();
      cargarRecientes();
      el('codigo').focus();
    } else {
      errEl.textContent = 'Contraseña incorrecta.';
    }
  } catch (e) {
    errEl.textContent = 'Error de conexión.';
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}

function doLogout() {
  el('login-screen').style.display = 'flex';
  el('app').style.display = 'none';
  el('login-pass').value = '';
  resetForm();
}

// ---------- AGREGAR PRENDA AL CARRITO ----------
function limpiarAvisos() {
  el('buscar-error').textContent = '';
  el('estado-aviso').innerHTML = '';
  el('agregado').textContent = '';
}

async function agregarPrenda() {
  const codigo = el('codigo').value.trim();
  limpiarAvisos();
  if (!codigo) { el('buscar-error').textContent = 'Ingresá un código.'; return; }

  el('buscar-loader').style.display = 'flex';
  el('btn-agregar').disabled = true;
  try {
    const res = await api('getPrenda', { codigo });
    if (!res || !res.ok) { el('buscar-error').textContent = (res && res.error) || 'Prenda no encontrada.'; return; }
    const p = res.prenda;
    const est = p.estado || '';
    const aviso = el('estado-aviso');

    if (carrito.some(x => x.codigo.toLowerCase() === String(p.codigo).toLowerCase())) {
      el('buscar-error').textContent = p.codigo + ' ya está en el carrito.';
      return;
    }
    if (est === 'Vendida' || est === 'Devuelta') {
      aviso.innerHTML = '<div class="aviso rojo"><strong>' + esc(p.codigo) + '</strong> figura como <strong>' + esc(est) + '</strong>. No se puede vender.</div>';
      return;
    }
    if (p.reserva) {
      mostrarReserva(p);
      return;
    }

    carrito.push({
      codigo: String(p.codigo), producto: p.producto || '', talle: p.talle || '',
      precioManual: p.precioManual || 0, precioTj: p.precioTj || 0,
      proveedor: p.proveedorNombre ? p.proveedorNombre + ' (' + (p.proveedor || '') + ')' : String(p.proveedor || ''),
      desc: '', manual: null
    });
    renderCarrito();

    let extra = '';
    if (est === 'Reservada') extra = 'figura como Reservada pero no encontré la reserva en Ventas. Revisala.';
    else if (est === 'Última Oportunidad') extra = 'está en Última Oportunidad.';
    else if (est === 'Revisar') extra = 'está marcada para Revisar. Fijate antes de venderla.';
    else if (est) extra = 'estado: ' + est + '.';
    if (extra) aviso.innerHTML = '<div class="aviso ambar"><strong>' + esc(p.codigo) + '</strong> ' + esc(extra) + '</div>';

    el('agregado').textContent = '✓ ' + p.codigo + ' agregada · ' + carrito.length + (carrito.length === 1 ? ' prenda' : ' prendas');
    el('codigo').value = '';
  } catch (e) {
    el('buscar-error').textContent = 'Error de conexión.';
  } finally {
    el('buscar-loader').style.display = 'none';
    el('btn-agregar').disabled = false;
    el('codigo').focus();
  }
}

function quitarPrenda(i) {
  carrito.splice(i, 1);
  limpiarAvisos();
  renderCarrito();
}

// ---------- PRECIOS ----------
// Precio de lista de una prenda según el medio: efectivo o con recargo.
function precioLista(it, medio) {
  if (!medio) return 0;
  const ef = it.precioManual || 0;
  if (!conRecargo(medio)) return ef;
  return it.precioTj || Math.round(ef / FACTOR_RECARGO);
}

// "20", "20%", "12,5" -> número. Vacío o raro -> 0.
function leerDesc(txt) {
  const n = parseFloat(String(txt || '').replace('%', '').replace(',', '.').trim());
  if (!n || n < 0 || n >= 100) return 0;
  return n;
}

function precioFinal(it, medio) {
  if (it.manual !== null) return it.manual;
  const lista = precioLista(it, medio);
  if (!lista) return 0;
  return Math.round(lista * (1 - leerDesc(it.desc) / 100));
}

// Arma la lista de prendas (solo al agregar o quitar).
function renderCarrito() {
  el('form-venta').style.display = carrito.length ? 'block' : 'none';
  el('carrito').innerHTML = carrito.map((it, i) => `
    <div class="item">
      <div class="item-top">
        <div>
          <div class="item-cod">${esc(it.codigo)}</div>
          <div class="item-desc">${esc(it.producto)}</div>
          <div class="item-meta">${it.talle ? 'Talle ' + esc(it.talle) + ' · ' : ''}${esc(it.proveedor)}</div>
        </div>
        <button class="item-quitar" onclick="quitarPrenda(${i})" title="Quitar">×</button>
      </div>
      <div class="item-precios">
        <div><label>Precio</label><div class="item-lista" id="lista-${i}">—</div></div>
        <div><label>Desc. %</label><input type="text" inputmode="decimal" id="desc-${i}" placeholder="0" oninput="cambioDesc(${i})"></div>
        <div><label>Final $</label><input type="number" id="final-${i}" oninput="cambioFinal(${i})"></div>
      </div>
      <div class="item-nota" id="nota-${i}"></div>
    </div>`).join('');
  carrito.forEach((it, i) => { el('desc-' + i).value = it.desc; });
  actualizarPrecios();
}

// Recalcula precios y total sin rearmar la lista.
function actualizarPrecios(salvo) {
  const medio = el('venta-medio').value;
  carrito.forEach((it, i) => {
    const lista = precioLista(it, medio);
    el('lista-' + i).textContent = medio ? (lista ? fmt(lista) : 'sin precio') : 'elegí medio';
    const final = precioFinal(it, medio);
    if (salvo !== i) el('final-' + i).value = final || '';
    const d = leerDesc(it.desc);
    el('nota-' + i).textContent =
      it.manual !== null ? 'Precio escrito a mano' :
      (medio && !lista) ? 'Sin precio cargado: escribilo a mano' :
      (d && medio) ? '−' + d + '% = ' + fmt(final) : '';
  });
  const total = carrito.reduce((s, it) => s + (precioFinal(it, medio) || 0), 0);
  el('total').textContent = fmt(total);
  el('total-label').textContent = 'Total · ' + carrito.length + (carrito.length === 1 ? ' prenda' : ' prendas');
  mostrarSaldoCliente();
}

function cambioDesc(i) {
  carrito[i].desc = el('desc-' + i).value;
  carrito[i].manual = null;
  actualizarPrecios();
}

// Si escribe el precio final a mano, vale lo que escribió.
function cambioFinal(i) {
  const v = el('final-' + i).value;
  carrito[i].manual = v === '' ? null : (parseFloat(v) || 0);
  if (carrito[i].manual !== null) { carrito[i].desc = ''; el('desc-' + i).value = ''; }
  actualizarPrecios(i);
}

function totalCarrito() {
  const medio = el('venta-medio').value;
  return carrito.reduce((s, it) => s + (precioFinal(it, medio) || 0), 0);
}

// ---------- PAGO PARCIAL ----------
function togglePagoParcial() {
  const completo = el('venta-pago-completo').checked;
  el('wrap-monto-pagado').style.display = completo ? 'none' : 'block';
  if (completo) el('venta-monto-pagado').value = '';
  mostrarSaldoCliente();
}

function mostrarSaldoCliente() {
  const info = el('saldo-cliente-info');
  if (el('venta-pago-completo').checked) { info.textContent = ''; return; }
  const total = totalCarrito();
  const pagado = parseFloat(el('venta-monto-pagado').value) || 0;
  const saldo = total - pagado;
  info.textContent = total > 0 ? (saldo > 0 ? 'Queda pendiente de cobrar: ' + fmt(saldo) : 'Sin saldo pendiente.') : '';
}

// ---------- GUARDAR ----------
async function guardarVenta() {
  const fb = el('guardar-feedback');
  const btn = el('btn-guardar');
  fb.innerHTML = '';
  if (!carrito.length) return;
  const cliente = el('venta-cliente').value.trim();
  const medio = el('venta-medio').value;
  if (!cliente || !medio) {
    fb.innerHTML = '<div class="error-msg">Completá cliente y medio de pago.</div>';
    return;
  }
  const items = carrito.map(it => {
    const d = leerDesc(it.desc);
    return {
      codigo: it.codigo, producto: it.producto, talle: it.talle,
      importe: precioFinal(it, medio),
      nota: (it.manual === null && d) ? '-' + d + '% off' : ''
    };
  });
  const sinPrecio = items.filter(x => !(x.importe > 0)).map(x => x.codigo);
  if (sinPrecio.length) {
    fb.innerHTML = '<div class="error-msg">Falta el precio de: ' + esc(sinPrecio.join(', ')) + '</div>';
    return;
  }
  const total = items.reduce((s, x) => s + x.importe, 0);
  const pagoCompleto = el('venta-pago-completo').checked;
  const montoPagado = pagoCompleto ? total : (parseFloat(el('venta-monto-pagado').value) || 0);

  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const res = await api('registrarVentas', {
      items: JSON.stringify(items),
      fecha: el('venta-fecha').value, cliente, medio,
      condicion: el('venta-condicion').value,
      envio: el('venta-envio').value,
      notas: el('venta-notas').value.trim(),
      montoPagado
    });
    if (res && res.success) {
      fb.innerHTML = '<div class="success-msg">✓ Venta cargada · ' + items.length + (items.length === 1 ? ' prenda' : ' prendas') + ' · ' + fmt(total) + '</div>';
      setTimeout(() => { resetForm(); cargarRecientes(); }, 1500);
    } else {
      fb.innerHTML = '<div class="error-msg">⚠️ ' + esc((res && res.error) || 'No se pudo confirmar. Revisá el Sheet antes de reintentar.') + '</div>';
    }
  } catch (e) {
    fb.innerHTML = '<div class="error-msg">⚠️ Sin confirmación — puede haberse guardado igual. Revisá el Sheet antes de reintentar.</div>';
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar venta';
  }
}

// ---------- RESERVAS ----------
function mostrarReserva(p) {
  prendaReserva = p;
  reservaActual = p.reserva;
  const r = p.reserva;
  const saldo = r.saldo ? ' · debe ' + fmt(r.saldo) : '';
  el('reserva-cod').textContent = p.codigo;
  el('reserva-info').innerHTML =
    esc(p.producto) + '<br>Reservada por <strong>' + esc(r.cliente || '—') + '</strong> el ' + esc(r.fecha || '—') +
    '<br>' + fmt(r.importe) + ' por ' + esc(r.medio || 'medio sin cargar') + saldo;
  const medio = ['Transferencia', 'Efectivo', 'Tarjeta'].indexOf(r.medio) > -1 ? r.medio : 'Transferencia';
  el('reserva-medio').value = medio;
  el('reserva-medio').dataset.anterior = medio;
  el('reserva-importe').value = r.importe || '';
  el('reserva-feedback').innerHTML = '';
  el('reserva-card').style.display = 'block';
  el('codigo').value = '';
}

function cerrarReserva() {
  prendaReserva = null;
  reservaActual = null;
  el('reserva-card').style.display = 'none';
}

// Si cambia de efectivo a transferencia (o al revés), ajusta el recargo.
function reservaCambioMedio() {
  const sel = el('reserva-medio');
  const antes = sel.dataset.anterior;
  const ahora = sel.value;
  const imp = parseFloat(el('reserva-importe').value) || 0;
  if (imp && conRecargo(antes) !== conRecargo(ahora)) {
    el('reserva-importe').value = conRecargo(ahora) ? Math.round(imp / FACTOR_RECARGO) : Math.round(imp * FACTOR_RECARGO);
  }
  sel.dataset.anterior = ahora;
}

async function confirmarReserva() {
  if (!prendaReserva || !reservaActual) return;
  const fb = el('reserva-feedback');
  const btn = el('btn-reserva');
  const importe = el('reserva-importe').value;
  const medio = el('reserva-medio').value;
  fb.innerHTML = '';
  if (!importe) { fb.innerHTML = '<div class="error-msg">Falta el importe.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const res = await api('confirmarReserva', {
      codigo: prendaReserva.codigo, fila: reservaActual.fila,
      importe: parseFloat(importe), medio
    });
    if (res && res.success) {
      fb.innerHTML = '<div class="success-msg">✓ Reserva pagada, quedó Vendida</div>';
      setTimeout(() => { cerrarReserva(); cargarRecientes(); }, 1500);
    } else {
      fb.innerHTML = '<div class="error-msg">⚠️ ' + esc((res && res.error) || 'No se pudo confirmar. Revisá el Sheet.') + '</div>';
    }
  } catch (e) {
    fb.innerHTML = '<div class="error-msg">⚠️ Sin confirmación — puede haberse guardado igual. Revisá el Sheet.</div>';
  } finally {
    btn.disabled = false; btn.textContent = 'Confirmar pago';
  }
}

// ---------- LIMPIAR ----------
function resetForm() {
  carrito = [];
  cerrarReserva();
  limpiarAvisos();
  el('codigo').value = '';
  el('venta-cliente').value = '';
  el('venta-medio').value = '';
  el('venta-pago-completo').checked = true;
  el('venta-monto-pagado').value = '';
  el('wrap-monto-pagado').style.display = 'none';
  el('saldo-cliente-info').textContent = '';
  el('venta-condicion').value = 'Vendido';
  el('venta-envio').value = '';
  el('venta-notas').value = '';
  el('venta-fecha').value = fechaHoy();
  el('guardar-feedback').innerHTML = '';
  renderCarrito();
}

// ---------- VENTAS RECIENTES ----------
async function cargarRecientes() {
  const lista = el('recientes-list');
  el('recientes-loader').style.display = 'flex';
  lista.innerHTML = '';
  try {
    const res = await api('getUltimasVentas', { n: 10 });
    el('recientes-loader').style.display = 'none';
    const ventas = res.ventas || [];
    if (!ventas.length) { lista.innerHTML = '<div class="empty-state">No hay ventas cargadas aún</div>'; return; }
    lista.innerHTML = ventas.map(v => {
      const cond = String(v.condicion || '');
      const chip = cond && cond !== 'Vendido' ? ' <span class="estado otro">' + esc(cond) + '</span>' : '';
      const saldo = v.saldo ? ' · debe ' + fmt(v.saldo) : '';
      return `
      <div class="reciente-item">
        <div>
          <div class="reciente-cod">${esc(v.codigo)}${chip}</div>
          <div class="reciente-desc">${esc(v.producto)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">${esc(v.cliente)} · ${esc(v.medio)}${saldo}</div>
        </div>
        <div class="reciente-right">
          <div class="reciente-importe">${fmt(v.importe)}</div>
          <div class="reciente-fecha">${esc(v.fecha)}</div>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    el('recientes-loader').style.display = 'none';
    lista.innerHTML = '<div class="empty-state">Error al cargar</div>';
  }
}

</script>
